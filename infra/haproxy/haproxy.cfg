global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  timeout connect 5s
  timeout client  1h
  timeout server  1h

frontend public_http
  bind *:80
  mode http
  default_backend web_http

backend web_http
  mode http
  server web web:8080 check

frontend public_tls
  bind *:443
  mode tcp
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend livekit_turn_tls if { req.ssl_sni -i turn.voice-horizon.online }
  default_backend web_tls

backend web_tls
  mode tcp
  server web web:8443 check

backend livekit_turn_tls
  mode tcp
  server livekit livekit:443 send-proxy-v2
