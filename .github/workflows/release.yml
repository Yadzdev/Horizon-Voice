name: Build and publish BDS preview release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[test]'
        working-directory: backend
      - name: Run backend tests
        run: python -m pytest
        working-directory: backend
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
  package-and-publish:
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package add-on and source
        run: |
          python -m json.tool addon/behavior_pack/manifest.json > /dev/null
          python -m json.tool addon/resource_pack/manifest.json > /dev/null
          python -m compileall -q scripts
          python scripts/package_addon.py
          python scripts/package_source.py
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/HorizonVoice-BDS-PREVIEW.mcaddon
            dist/HorizonVoice_BP.mcpack
            dist/HorizonVoice_RP.mcpack
            dist/Horizon-Voice-Source.zip
